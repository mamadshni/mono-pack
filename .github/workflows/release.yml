name: Release

# Your entire release flow:
#   pnpm version patch     (bumps root, auto-commits, auto-tags vX.Y.Z)
#   git push && git push --tags
# The tag push triggers this workflow, which stamps the tag's version onto
# @mamadshni/web-components and publishes it to GitHub Packages.
# The storybook package is private and is never published.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@mamadshni'

      - name: Resolve version and dist-tag from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-*) DIST_TAG="${VERSION#*-}"; DIST_TAG="${DIST_TAG%%.*}" ;;
            *)   DIST_TAG="latest" ;;
          esac
          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint && pnpm typecheck

      - name: Stamp version from tag onto the package
        run: |
          pnpm --filter @mamadshni/web-components exec npm version \
            "${{ steps.meta.outputs.version }}" \
            --no-git-tag-version --allow-same-version

      - name: Build & publish @mamadshni/web-components to GitHub Packages
        run: |
          pnpm --filter @mamadshni/web-components build
          pnpm --filter @mamadshni/web-components publish \
            --tag "${{ steps.meta.outputs.dist_tag }}" \
            --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
