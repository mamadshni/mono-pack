name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options: [web-components, storybook]
      dist-tag:
        description: npm dist-tag (use e.g. "beta" for prereleases)
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint && pnpm typecheck

      - name: Publish @acme/web-components
        if: inputs.package == 'web-components'
        run: pnpm release:wc --tag ${{ inputs.dist-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @acme/storybook
        if: inputs.package == 'storybook'
        run: pnpm release:sb --tag ${{ inputs.dist-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
